
name: Promote Between Environments

# Promote an image to the next environment.
# Chain: dev -> qa -> ppd -> prod.
# This workflow updates JSON and creates a pull request.
# Deployment runs after the promotion PR is merged.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to promote (example: leetcode-spa)"
        required: true
        type: string
      from_environment:
        description: "Source environment"
        required: true
        type: choice
        options: [dev, qa, ppd]
      to_environment:
        description: "Target environment"
        required: true
        type: choice
        options: [qa, ppd, prod]
      notes:
        description: "Optional pull request notes"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    name: Promote ${{ inputs.app }} (${{ inputs.from_environment }} to ${{ inputs.to_environment }})
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate promotion direction
        env:
          APP_NAME: ${{ inputs.app }}
          FROM: ${{ inputs.from_environment }}
          TO: ${{ inputs.to_environment }}
        run: |
          set -euo pipefail

          if [[ ! "$APP_NAME" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "ERROR: Invalid application name." >&2
            exit 1
          fi

          declare -A VALID_CHAIN=(
            ["dev"]="qa"
            ["qa"]="ppd"
            ["ppd"]="prod"
          )

          EXPECTED="${VALID_CHAIN[$FROM]:-}"

          if [[ -z "$EXPECTED" || "$TO" != "$EXPECTED" ]]; then
            echo "ERROR: Invalid promotion from $FROM to $TO." >&2
            exit 1
          fi

          echo "Valid promotion: $FROM to $TO"

      - name: Read source image
        id: source
        env:
          APP_NAME: ${{ inputs.app }}
          FROM: ${{ inputs.from_environment }}
        run: |
          set -euo pipefail

          FROM_FILE="apps/$APP_NAME/$FROM.json"

          if [[ ! -f "$FROM_FILE" ]]; then
            echo "ERROR: Source configuration not found: $FROM_FILE" >&2
            exit 1
          fi

          IMAGE="$(jq -er '.image | strings' "$FROM_FILE")"
          TAG="${IMAGE##*:}"
          COMMIT_SHA="$(jq -er '.commitSha | strings' "$FROM_FILE")"
          DEPLOYED_AT="$(jq -er '.deployedAt | strings' "$FROM_FILE")"

          {
            echo "image=$IMAGE"
            echo "tag=$TAG"
            echo "commit_sha=$COMMIT_SHA"
            echo "deployed_at=$DEPLOYED_AT"
          } >> "$GITHUB_OUTPUT"

          echo "Source image: $IMAGE"

      - name: Validate image for target environment
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          TO: ${{ inputs.to_environment }}
        run: |
          set -euo pipefail

          bash scripts/validate-image.sh --format-only "$TO" "$IMAGE"

      - name: Prepare promotion branch
        id: check-pr
        env:
          APP_NAME: ${{ inputs.app }}
          FROM: ${{ inputs.from_environment }}
          TO: ${{ inputs.to_environment }}
        run: |
          set -euo pipefail

          BRANCH="promote/${APP_NAME}/${FROM}-to-${TO}"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Update target environment JSON
        env:
          APP_NAME: ${{ inputs.app }}
          FROM: ${{ inputs.from_environment }}
          TO: ${{ inputs.to_environment }}
          IMAGE: ${{ steps.source.outputs.image }}
          COMMIT_SHA: ${{ steps.source.outputs.commit_sha }}
          ACTOR: ${{ github.actor }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail

          TO_FILE="apps/$APP_NAME/$TO.json"

          if [[ ! -f "$TO_FILE" ]]; then
            echo "ERROR: Target configuration not found: $TO_FILE" >&2
            exit 1
          fi

          NOW="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          TEMP="$(mktemp)"
          trap 'rm -f "$TEMP"' EXIT

          jq \
            --arg img "$IMAGE" \
            --arg ts "$NOW" \
            --arg by "$ACTOR" \
            --arg sha "$COMMIT_SHA" \
            --arg note "Promoted from $FROM by $ACTOR. $NOTES" \
            '.image = $img |
             .deployedAt = $ts |
             .deployedBy = $by |
             .commitSha = $sha |
             .notes = $note' \
            "$TO_FILE" > "$TEMP"

          mv "$TEMP" "$TO_FILE"

          echo "Updated configuration: $TO_FILE"

      - name: Create promotion branch and PR
        env:
          BRANCH: ${{ steps.check-pr.outputs.branch }}
          IMAGE: ${{ steps.source.outputs.image }}
          APP_NAME: ${{ inputs.app }}
          FROM: ${{ inputs.from_environment }}
          TO: ${{ inputs.to_environment }}
          COMMIT_SHA: ${{ steps.source.outputs.commit_sha }}
          ACTOR: ${{ github.actor }}
          NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add -- "apps/$APP_NAME/$TO.json"

          if git diff --cached --quiet; then
            echo "No configuration changes to promote."
            exit 0
          fi

          git commit -m "promote($APP_NAME): $FROM to $TO - $IMAGE"

          # Never overwrite an existing remote branch.
          git push origin "$BRANCH"

          PR_BODY="$(mktemp)"
          trap 'rm -f "$PR_BODY"' EXIT

          {
            echo "## Environment promotion"
            echo ""
            printf '**App:** %s\n' "$APP_NAME"
            printf '**From:** %s\n' "$FROM"
            printf '**To:** %s\n' "$TO"
            printf '**Image:** %s\n' "$IMAGE"
            printf '**Commit:** %s\n' "$COMMIT_SHA"
            printf '**Promoted by:** @%s\n' "$ACTOR"
            echo ""
            echo "---"
            echo ""
            echo "### Checklist"
            echo "- [ ] Smoke tests passed in source environment"
            echo "- [ ] QA or stakeholder approval obtained"
            echo "- [ ] Docker image validated"
            echo "- [ ] No active incidents in source environment"
            echo ""
            echo "Merging this PR will trigger deployment to the target environment."
            if [[ -n "$NOTES" ]]; then
              echo ""
              echo "### Notes"
              printf '%s\n' "$NOTES"
            fi
          } > "$PR_BODY"

          gh pr create \
            --title "promote($APP_NAME): $FROM to $TO - $IMAGE" \
            --body-file "$PR_BODY" \
            --base master \
            --head "$BRANCH" \
            --assignee "$ACTOR"
