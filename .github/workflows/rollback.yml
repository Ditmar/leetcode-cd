name: Rollback Environment

# Rollback a una versión anterior en un ambiente específico.
# Estrategias disponibles:
#   - git-history: usa git log para encontrar la versión anterior del JSON
#   - manual-tag:  especifica el tag Docker directamente
on:
  workflow_dispatch:
    inputs:
      app:
        description: "App a hacer rollback (ej: my-app)"
        required: true
        type: string
      environment:
        description: "Ambiente objetivo"
        required: true
        type: choice
        options: [ppd, prod]
      strategy:
        description: "Estrategia de rollback"
        required: true
        type: choice
        options:
          - git-history   # rollback a la versión anterior según git
          - manual-tag    # especificar tag manualmente
      target_tag:
        description: "Tag Docker a restaurar (solo para strategy=manual-tag, ej: 1.0.1)"
        required: false
        type: string
      reason:
        description: "Razón del rollback (requerido para auditoría)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  rollback:
    name: Rollback ${{ inputs.app }} in ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # Requiere aprobación en prod
    env:
      APP_NAME: ${{ inputs.app }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      ROLLBACK_STRATEGY: ${{ inputs.strategy }}
      TARGET_TAG: ${{ inputs.target_tag }}
      ROLLBACK_REASON: ${{ inputs.reason }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20  # Necesitamos historial para git-history strategy
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: sudo apt-get install -y -qq jq

      - name: Validate rollback inputs
        run: |
          if [[ ! "$APP_NAME" =~ ^[a-z0-9-]+$ ]]; then
            echo "❌ Nombre de app inválido: $APP_NAME"
            exit 1
          fi
          APP_DIR="apps/$APP_NAME"
          if [[ ! -d "$APP_DIR" || -L "$APP_DIR" ]]; then
            echo "❌ Directorio de app no válido: $APP_DIR"
            exit 1
          fi
          if [[ "$ROLLBACK_STRATEGY" == "manual-tag" && ! "$TARGET_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "❌ target_tag no cumple el formato semántico esperado"
            exit 1
          fi

      - name: Show current state
        id: current
        run: |
          CONFIG_FILE="apps/$APP_NAME/$TARGET_ENVIRONMENT.json"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          printf '  Estado actual en %s\n' "$TARGET_ENVIRONMENT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          cat "$CONFIG_FILE"

          CURRENT_IMAGE=$(jq -r '.image' "$CONFIG_FILE")
          echo "current_image=$CURRENT_IMAGE" >> "$GITHUB_OUTPUT"
          echo "config_file=$CONFIG_FILE"     >> "$GITHUB_OUTPUT"

      - name: Determine rollback target (git-history)
        id: resolve-git
        if: inputs.strategy == 'git-history'
        run: |
          CONFIG_FILE="$CURRENT_CONFIG_FILE"

          # Obtener el penúltimo estado del archivo en git
          PREV_IMAGE=$(git log --oneline -10 -- "$CONFIG_FILE" | \
            awk 'NR==2{print $1}' | \
            xargs -I{} git show {}:"$CONFIG_FILE" 2>/dev/null | \
            jq -r '.image // empty')

          if [[ -z "$PREV_IMAGE" ]]; then
            echo "❌ No se encontró versión anterior en el historial de git."
            echo "Usa strategy=manual-tag y especifica el tag directamente."
            exit 1
          fi

          echo "target_image=$PREV_IMAGE" >> "$GITHUB_OUTPUT"
          echo "📦 Versión anterior encontrada: $PREV_IMAGE"
        env:
          CURRENT_CONFIG_FILE: ${{ steps.current.outputs.config_file }}

      - name: Determine rollback target (manual-tag)
        id: resolve-manual
        if: inputs.strategy == 'manual-tag'
        run: |
          # Construir imagen completa con el tag proporcionado
          CURRENT_IMAGE="$CURRENT_IMAGE_FROM_CONFIG"
          IMAGE_BASE="${CURRENT_IMAGE%:*}"  # Todo menos el tag
          TARGET_IMAGE="${IMAGE_BASE}:${TARGET_TAG}"

          echo "target_image=$TARGET_IMAGE" >> "$GITHUB_OUTPUT"
          echo "📦 Target de rollback: $TARGET_IMAGE"
        env:
          CURRENT_IMAGE_FROM_CONFIG: ${{ steps.current.outputs.current_image }}

      - name: Consolidate target image
        id: target
        run: |
          if [[ "$ROLLBACK_STRATEGY" == "git-history" ]]; then
            echo "image=$GIT_HISTORY_TARGET_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "image=$MANUAL_TARGET_IMAGE" >> "$GITHUB_OUTPUT"
          fi
        env:
          GIT_HISTORY_TARGET_IMAGE: ${{ steps.resolve-git.outputs.target_image }}
          MANUAL_TARGET_IMAGE: ${{ steps.resolve-manual.outputs.target_image }}

      - name: Validate rollback image exists
        run: |
          chmod +x scripts/validate-image.sh
          TARGET_IMAGE="$ROLLBACK_TARGET_IMAGE"
          RAILWAY_ENVIRONMENT="$TARGET_ENVIRONMENT" \
            ./scripts/validate-image.sh "$TARGET_IMAGE"
        env:
          ROLLBACK_TARGET_IMAGE: ${{ steps.target.outputs.image }}

      - name: Show rollback plan
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  PLAN DE ROLLBACK"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          printf '  App:        %s\n' "$APP_NAME"
          printf '  Ambiente:   %s\n' "$TARGET_ENVIRONMENT"
          printf '  Actual:     %s\n' "$CURRENT_IMAGE"
          printf '  Rollback a: %s\n' "$ROLLBACK_TARGET_IMAGE"
          printf '  Estrategia: %s\n' "$ROLLBACK_STRATEGY"
          printf '  Razón:      %s\n' "$ROLLBACK_REASON"
          printf '  Ejecutado por: %s\n' "$GITHUB_ACTOR"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        env:
          CURRENT_IMAGE: ${{ steps.current.outputs.current_image }}
          ROLLBACK_TARGET_IMAGE: ${{ steps.target.outputs.image }}

      - name: Update environment JSON with rollback image
        run: |
          CONFIG_FILE="$CURRENT_CONFIG_FILE"
          TARGET_IMAGE="$ROLLBACK_TARGET_IMAGE"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          TEMP=$(mktemp)
          jq --arg img "$TARGET_IMAGE" \
             --arg ts "$NOW" \
             --arg by "$GITHUB_ACTOR" \
             --arg current "$CURRENT_IMAGE" \
             --arg reason "$ROLLBACK_REASON" \
             '.image = $img | .deployedAt = $ts | .deployedBy = $by | .notes = ("ROLLBACK desde " + $current + " → " + $img + ". Razón: " + $reason)' \
             "$CONFIG_FILE" > "$TEMP"
          mv "$TEMP" "$CONFIG_FILE"
        env:
          CURRENT_CONFIG_FILE: ${{ steps.current.outputs.config_file }}
          CURRENT_IMAGE: ${{ steps.current.outputs.current_image }}
          ROLLBACK_TARGET_IMAGE: ${{ steps.target.outputs.image }}

      - name: Deploy rollback via deploy script
        run: |
          chmod +x scripts/deploy-railway.sh
          ./scripts/deploy-railway.sh "$CURRENT_CONFIG_FILE"
        env:
          CURRENT_CONFIG_FILE: ${{ steps.current.outputs.config_file }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Commit rollback state to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CURRENT_CONFIG_FILE"
          COMMIT_MSG=$(printf '%s\n\n%s\n%s\n%s' \
            "rollback($APP_NAME/$TARGET_ENVIRONMENT): → $ROLLBACK_TARGET_IMAGE" \
            "Rollback ejecutado por: $GITHUB_ACTOR" \
            "Razón: $ROLLBACK_REASON" \
            "Imagen anterior: $CURRENT_IMAGE")
          git commit -m "$COMMIT_MSG"
          git push
        env:
          CURRENT_CONFIG_FILE: ${{ steps.current.outputs.config_file }}
          CURRENT_IMAGE: ${{ steps.current.outputs.current_image }}
          ROLLBACK_TARGET_IMAGE: ${{ steps.target.outputs.image }}

      - name: Summary
        run: |
          printf '## ✅ Rollback completado\n\n| Campo | Valor |\n|-------|-------|\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| App | %s |\n| Ambiente | %s |\n| Imagen anterior | %s |\n| Imagen restaurada | %s |\n| Razón | %s |\n| Ejecutado por | %s |\n' \
            "$APP_NAME" "$TARGET_ENVIRONMENT" "$CURRENT_IMAGE" \
            "$ROLLBACK_TARGET_IMAGE" "$ROLLBACK_REASON" "$GITHUB_ACTOR" \
            >> "$GITHUB_STEP_SUMMARY"
        env:
          CURRENT_IMAGE: ${{ steps.current.outputs.current_image }}
          ROLLBACK_TARGET_IMAGE: ${{ steps.target.outputs.image }}
