name: Deploy to Railway

# ── Triggers ──────────────────────────────────────────────────────────────────
# Se dispara cuando se hace merge a main de un PR que modifica un archivo de ambiente.
# También puede dispararse manualmente con elección de ambiente.
on:
  push:
    branches: [master]
    paths:
      - "apps/**/ppd.json"
      - "apps/**/prod.json"

  workflow_dispatch:
    inputs:
      app:
        description: "Nombre de la app (ej: my-app)"
        required: true
        type: string
      environment:
        description: "Ambiente a desplegar"
        required: true
        type: choice
        options: [ppd, prod]

# ── Permisos mínimos necesarios ───────────────────────────────────────────────
permissions:
  contents: write   # para commitear la actualización de deployedAt en el JSON
  pull-requests: read

jobs:
  # ── Detectar qué archivos cambiaron ────────────────────────────────────────
  detect-changes:
    name: Detect changed environments
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has-changes: ${{ steps.build-matrix.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build deployment matrix
        id: build-matrix
        run: |
          # Manual dispatch: construir matrix desde inputs
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            APP="$APP_NAME"
            ENV="$TARGET_ENVIRONMENT"
            if [[ ! "$APP" =~ ^[a-z0-9-]+$ ]]; then
              echo "❌ Nombre de app inválido: $APP"
              exit 1
            fi
            if [[ ! -d "apps/$APP" || -L "apps/$APP" ]]; then
              echo "❌ Directorio de app no válido: apps/$APP"
              exit 1
            fi
            case "$ENV" in
              ppd|prod) ;;
              *) echo "❌ Ambiente inválido: $ENV"; exit 1 ;;
            esac

            MATRIX=$(jq -n \
              --arg app "$APP" \
              --arg env "$ENV" \
              --arg file "apps/$APP/$ENV.json" \
              '[{"app": $app, "environment": $env, "config_file": $file}]')
            printf 'matrix=%s\n' "$(jq -c . <<< "$MATRIX")" >> "$GITHUB_OUTPUT"
            printf 'has-changes=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Push a main: detectar archivos JSON que cambiaron
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- 'apps/**/*.json' 2>/dev/null || \
                          git diff --name-only HEAD^ HEAD -- 'apps/**/*.json')

          if [[ -z "$CHANGED_FILES" ]]; then
            printf 'has-changes=false\nmatrix=[]\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MATRIX="[]"
          while IFS= read -r file; do
            # Parsear app y ambiente del path: apps/<app>/<env>.json
            APP=$(echo "$file" | cut -d'/' -f2)
            ENV=$(echo "$file" | cut -d'/' -f3 | sed 's/\.json$//')
            if [[ ! "$APP" =~ ^[a-z0-9-]+$ ]]; then
              echo "❌ Nombre de app inválido en archivo cambiado: $file"
              exit 1
            fi
            if [[ ! -d "apps/$APP" || -L "apps/$APP" ]]; then
              echo "❌ Directorio de app no válido: apps/$APP"
              exit 1
            fi
            case "$ENV" in
              ppd|prod) ;;
              *) echo "❌ Ambiente inválido en archivo cambiado: $file"; exit 1 ;;
            esac
            if [[ "$file" != "apps/$APP/$ENV.json" ]]; then
              echo "❌ Ruta de configuración inválida: $file"
              exit 1
            fi
            ENTRY=$(jq -n \
              --arg app "$APP" \
              --arg env "$ENV" \
              --arg file "$file" \
              '{"app": $app, "environment": $env, "config_file": $file}')
            MATRIX=$(echo "$MATRIX" | jq --argjson entry "$ENTRY" '. + [$entry]')
          done <<< "$CHANGED_FILES"

          printf 'matrix=%s\n' "$(jq -c . <<< "$MATRIX")" >> "$GITHUB_OUTPUT"
          printf 'has-changes=true\n' >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          APP_NAME: ${{ inputs.app }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}

  # ── Deploy por cada ambiente que cambió ────────────────────────────────────
  deploy:
    name: Deploy ${{ matrix.app }} → ${{ matrix.environment }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest

    # Usar environment de GitHub para requerir aprobación en prod/ppd
    environment: ${{ matrix.environment }}

    # Serializa el acceso al repo: si la matrix despliega ppd y prod en paralelo,
    # ambos compiten por el mismo `git push` a master. El group es fijo (no
    # depende de matrix.environment) para que TODAS las entradas de la matrix
    # se encolen entre sí en vez de correr al mismo tiempo.
    concurrency:
      group: railway-cd-git-write
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          # fetch-depth: 0 (historial completo) es necesario para que el retry
          # con `git rebase origin/master` del step "Update metadata in config
          # file" funcione — con el default (depth=1) no hay historial suficiente.
          fetch-depth: 0

      - name: Install dependencies (jq, curl)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl

      - name: Validate deployment target
        run: |
          if [[ ! "$APP_NAME" =~ ^[a-z0-9-]+$ ]]; then
            echo "❌ Nombre de app inválido: $APP_NAME"
            exit 1
          fi
          if [[ ! -d "apps/$APP_NAME" || -L "apps/$APP_NAME" ]]; then
            echo "❌ Directorio de app no válido: apps/$APP_NAME"
            exit 1
          fi
          case "$DEPLOY_ENVIRONMENT" in
            ppd|prod) ;;
            *) echo "❌ Ambiente inválido: $DEPLOY_ENVIRONMENT"; exit 1 ;;
          esac
          EXPECTED_CONFIG="apps/$APP_NAME/$DEPLOY_ENVIRONMENT.json"
          if [[ "$CONFIG_FILE" != "$EXPECTED_CONFIG" || ! -f "$EXPECTED_CONFIG" ]]; then
            echo "❌ Configuración inválida o inexistente: $CONFIG_FILE"
            exit 1
          fi
        env:
          APP_NAME: ${{ matrix.app }}
          DEPLOY_ENVIRONMENT: ${{ matrix.environment }}
          CONFIG_FILE: ${{ matrix.config_file }}

      - name: Show deployment plan
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  DEPLOYMENT PLAN"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          printf '  App:         %s\n' "$APP_NAME"
          printf '  Environment: %s\n' "$DEPLOY_ENVIRONMENT"
          printf '  Config:      %s\n' "$CONFIG_FILE"
          printf '  Triggered by: %s\n' "$GITHUB_ACTOR"
          printf '  Commit:      %s\n' "$GITHUB_SHA"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          cat "$CONFIG_FILE"
        env:
          APP_NAME: ${{ matrix.app }}
          DEPLOY_ENVIRONMENT: ${{ matrix.environment }}
          CONFIG_FILE: ${{ matrix.config_file }}

      - name: Validate Docker image exists
        run: |
          chmod +x scripts/validate-image.sh
          IMAGE=$(jq -r '.image' "$CONFIG_FILE")
          RAILWAY_ENVIRONMENT="$DEPLOY_ENVIRONMENT" \
            ./scripts/validate-image.sh "$IMAGE"
        env:
          CONFIG_FILE: ${{ matrix.config_file }}
          DEPLOY_ENVIRONMENT: ${{ matrix.environment }}

      - name: Deploy to Railway
        run: |
          chmod +x scripts/deploy-railway.sh
          ./scripts/deploy-railway.sh "$CONFIG_FILE"
        env:
          CONFIG_FILE: ${{ matrix.config_file }}

      - name: Update metadata in config file
        run: |
          # deploy-railway.sh ya actualiza el JSON, ahora commiteamos el cambio
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CONFIG_FILE"
          git diff --staged --quiet && exit 0

          COMMIT_SUBJECT=$(printf 'chore(cd): update deploy metadata for %s/%s [skip ci]' "$APP_NAME" "$DEPLOY_ENVIRONMENT")
          git commit -m "$COMMIT_SUBJECT"

          # Retry con rebase: el `concurrency` group ya serializa los jobs de este
          # workflow, pero esto protege además contra pushes de otros workflows
          # (promote.yml, rollback.yml) que puedan tocar master al mismo tiempo.
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            if git push; then
              echo "✅ Push exitoso (intento $attempt)"
              exit 0
            fi

            if [[ "$attempt" -eq "$MAX_ATTEMPTS" ]]; then
              echo "❌ Push falló después de $MAX_ATTEMPTS intentos"
              exit 1
            fi

            echo "⚠️  Push rechazado (rama remota avanzó), reintentando con rebase..."
            sleep $(( RANDOM % 5 + 1 ))  # jitter para evitar reintentos sincronizados
            git fetch origin master
            git rebase origin/master || {
              git rebase --abort
              echo "❌ Rebase falló (posible conflicto real en el JSON), abortando"
              exit 1
            }
          done
        env:
          CONFIG_FILE: ${{ matrix.config_file }}
          APP_NAME: ${{ matrix.app }}
          DEPLOY_ENVIRONMENT: ${{ matrix.environment }}

      - name: Notify deployment success
        if: success()
        run: |
          IMAGE=$(jq -r '.image' "$CONFIG_FILE")
          printf '✅ Deployed %s to %s successfully\n' "$IMAGE" "$DEPLOY_ENVIRONMENT"
          # Aquí podrías agregar notificación a Slack/Teams:
          # curl -X POST "$SLACK_WEBHOOK" -d '{"text": "..."}'
        env:
          CONFIG_FILE: ${{ matrix.config_file }}
          DEPLOY_ENVIRONMENT: ${{ matrix.environment }}

      - name: Notify deployment failure
        if: failure()
        run: |
          printf '❌ Deployment FAILED for %s in %s\n' "$APP_NAME" "$DEPLOY_ENVIRONMENT"
          # Aquí agregar alerta a Slack/PagerDuty
        env:
          APP_NAME: ${{ matrix.app }}
          DEPLOY_ENVIRONMENT: ${{ matrix.environment }}
