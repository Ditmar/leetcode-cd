
name: Deploy to Railway

# Deploy when environment JSON files change on master.
# Manual deployment is also supported.
on:
  push:
    branches: [master]
    paths:
      - "apps/**/dev.json"
      - "apps/**/qa.json"
      - "apps/**/ppd.json"
      - "apps/**/prod.json"

  workflow_dispatch:
    inputs:
      app:
        description: "Application name (example: leetcode-spa)"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, qa, ppd, prod]

permissions:
  contents: write
  pull-requests: read

jobs:
  detect-changes:
    name: Detect changed environments
    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has-changes: ${{ steps.build-matrix.outputs.has-changes }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Build deployment matrix
        id: build-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          MATRIX='[]'

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$INPUT_APP" =~ ^[a-zA-Z0-9_-]+$ ]]; then
              echo "ERROR: Invalid application name." >&2
              exit 1
            fi

            case "$INPUT_ENVIRONMENT" in
              dev|qa|ppd|prod) ;;
              *)
                echo "ERROR: Invalid environment." >&2
                exit 1
                ;;
            esac

            CONFIG_FILE="apps/$INPUT_APP/$INPUT_ENVIRONMENT.json"

            if [[ ! -f "$CONFIG_FILE" ]]; then
              echo "ERROR: Configuration not found: $CONFIG_FILE" >&2
              exit 1
            fi

            MATRIX="$(
              jq -cn \
                --arg app "$INPUT_APP" \
                --arg env "$INPUT_ENVIRONMENT" \
                --arg file "$CONFIG_FILE" \
                '[{
                  app: $app,
                  environment: $env,
                  config_file: $file
                }]'
            )"
          else
            CHANGED_FILES="$(mktemp)"
            trap 'rm -f "$CHANGED_FILES"' EXIT

            if ! git diff --name-only -z HEAD^ HEAD -- apps/ > "$CHANGED_FILES"; then
              echo "ERROR: Could not detect changed files." >&2
              exit 1
            fi

            while IFS= read -r -d '' FILE; do
              if [[ ! "$FILE" =~ ^apps/([a-zA-Z0-9_-]+)/(dev|qa|ppd|prod)\.json$ ]]; then
                continue
              fi

              if [[ ! -f "$FILE" ]]; then
                continue
              fi

              APP_NAME="${BASH_REMATCH[1]}"
              TARGET_ENVIRONMENT="${BASH_REMATCH[2]}"

              ENTRY="$(
                jq -cn \
                  --arg app "$APP_NAME" \
                  --arg env "$TARGET_ENVIRONMENT" \
                  --arg file "$FILE" \
                  '{
                    app: $app,
                    environment: $env,
                    config_file: $file
                  }'
              )"

              MATRIX="$(
                jq -cn \
                  --argjson matrix "$MATRIX" \
                  --argjson entry "$ENTRY" \
                  '$matrix + [$entry]'
              )"
            done < "$CHANGED_FILES"
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

          if [[ "$MATRIX" == "[]" ]]; then
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
            echo "No environments require deployment."
          else
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
            echo "Deployment matrix: $MATRIX"
          fi

  deploy:
    name: Deploy ${{ matrix.app }} to ${{ matrix.environment }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-24.04

    environment: ${{ matrix.environment }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show deployment plan
        env:
          APP_NAME: ${{ matrix.app }}
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
          CONFIG_FILE: ${{ matrix.config_file }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "DEPLOYMENT PLAN"
          printf 'App: %s\n' "$APP_NAME"
          printf 'Environment: %s\n' "$TARGET_ENVIRONMENT"
          printf 'Configuration: %s\n' "$CONFIG_FILE"
          printf 'Triggered by: %s\n' "$ACTOR"
          printf 'Commit: %s\n' "$COMMIT_SHA"

          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "ERROR: Deployment configuration not found." >&2
            exit 1
          fi

          cat "$CONFIG_FILE"

      - name: Deploy to Railway
        env:
          CONFIG_FILE: ${{ matrix.config_file }}
        run: |
          set -euo pipefail

          # deploy-railway.sh validates the image before deployment.
          bash scripts/deploy-railway.sh "$CONFIG_FILE"

      - name: Update metadata in config file
        env:
          CONFIG_FILE: ${{ matrix.config_file }}
          APP_NAME: ${{ matrix.app }}
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -- "$CONFIG_FILE"

          if ! git diff --cached --quiet; then
            git commit -m "chore(cd): update deploy metadata for $APP_NAME/$TARGET_ENVIRONMENT [skip ci]"
            git push
          else
            echo "No metadata changes to commit."
          fi

      - name: Notify deployment success
        if: success()
        env:
          CONFIG_FILE: ${{ matrix.config_file }}
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail

          IMAGE="$(jq -er '.image | strings' "$CONFIG_FILE")"

          printf 'Deployed %s to %s successfully.\n' \
            "$IMAGE" "$TARGET_ENVIRONMENT"

      - name: Notify deployment failure
        if: failure()
        env:
          APP_NAME: ${{ matrix.app }}
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          printf 'Deployment failed for %s in %s.\n' \
            "$APP_NAME" "$TARGET_ENVIRONMENT" >&2
